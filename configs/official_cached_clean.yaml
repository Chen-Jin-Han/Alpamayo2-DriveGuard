backend: official
device: cuda
device_map: auto
offload_folder: .offload/alpamayo2
max_memory:
  0: 18GiB
  cpu: 400GiB
seed: 42
model_id: nvidia/Alpamayo2-Super
diffusion_steps: 10
data:
  source: cached
  path: data/physicalai/validation_sample_0.pt
attack: {name: clean, epsilon: 0}
objective: {feature: 1.0, trajectory: 1.0, temporal: 0.0}
success_thresholds: {feature_distance: 0.05, reasoning_similarity: 0.8, trajectory_deviation: 0.5, ade_increase: 0.5, fde_increase: 1.0}
defense: {name: none}
output_dir: outputs/official_physicalai_clean
